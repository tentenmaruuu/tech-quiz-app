<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Tech Quiz App</title>
  </head>
  <body>
    <h1>Tech Quiz App へようこそ！</h1>
    <p>調べたい技術用語を入力してください。</p>

    <form action="/" method="POST">
      <input type="text" name="keyword" placeholder="例:API" />
      <button type="submit">記事を作成する</button>
    </form>

    {% if keyword %}
    <h2>{{ title }}</h2>
    <p>{{ article }}</p>
    {% endif %} {% if quiz_question %}
    <h3>{{ quiz_question }}</h3>
    <form action="/" method="POST">
      {% for option in quiz_choices %}
      <p>
        <button type="submit" name="user_choice" value="{{ option }}">
          {{ option }}
        </button>
      </p>
      {% endfor %}
    </form>
    {% endif %}
  </body>
</html>
